services:
  db:
    image: mariadb:11.4
    container_name: gdtdevsur-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-3307}:3306"
    environment:
      MYSQL_USER: ${POSTGRES_USER:-gdtdevsur}
      MYSQL_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env}
      MYSQL_DATABASE: ${POSTGRES_DB:-gdtdevsur}
      MYSQL_ROOT_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env}
    volumes:
      - gdtdevsur_mariadata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  gdtdevsur_mariadata:
